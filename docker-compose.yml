version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uptime_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uptime_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: uptime_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: uptime_backend
    restart: always
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/uptime_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: your_super_secret_jwt_key
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: uptime_frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
