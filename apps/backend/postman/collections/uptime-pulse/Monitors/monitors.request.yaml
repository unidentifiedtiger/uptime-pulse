$kind: http-request
url: http://localhost:3000/api/monitors
method: POST
body:
  type: json
  content: |
    {
      "name": "Google",
      "url": "https://google.com",
      "interval": 60,
      "timeout": 5000
    }
auth:
  type: bearer
  credentials:
    token: "{{json_web_token_0ec9}}"
order: 1000
